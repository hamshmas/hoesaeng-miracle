        }
      } catch (_) {}
    }
    document.addEventListener('click', function (e) {
      var a = e.target && e.target.closest && e.target.closest('a[href]');
      if (!a) return;
      var href = a.getAttribute('href') || '';
      if (href.indexOf('tel:') === 0) {
        fireConversion('phone_call_click', 'call');
      } else if (href.indexOf('pf.kakao.com') !== -1 || href.indexOf('kakao.com/chat') !== -1) {
        fireConversion('kakao_chat_click', 'inquiry');
      }
    }, true);
  })();
